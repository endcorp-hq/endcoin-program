[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
endcoin = "Fyg2zFo8HzsyHqeNE2DRabhHZCekwY42jTVjivTfT8HB"

[programs.localnet]
endcoin = "Fyg2zFo8HzsyHqeNE2DRabhHZCekwY42jTVjivTfT8HB"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/wba-wallet.json"

[scripts]
deploy-0 = "yarn run ts-node deployment/00_generate_keypairs.ts"
deploy-1 = "yarn run ts-node deployment/create-amm.ts"
deploy-2 = "yarn run ts-node deployment/02_create-metadata.ts"
deploy-3 = "yarn run ts-node deployment/create-pool.ts"
deploy-4 = "yarn run ts-node deployment/create-reward.ts"
deploy-all = "yarn run ts-node deployment/deploy-all.ts"
emit = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/emit.ts"
gettime = "yarn run ts-node tests/000_gettime.ts"
init = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/00_init.ts"
localnet-init = "yarn localnet:init"
localnet-simulate = "yarn localnet:simulate"
localnet-smoke = "yarn localnet:smoke"
localnet-mev = "yarn localnet:mev"
localnet-test = "yarn localnet:test"
swap = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/swap.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts"
test-0 = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/test.ts"
update-admin = "yarn run ts-node deployment/update-amm-admin.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899
